# For Dokploy's Compose deployment type (or a plain `docker compose up -d` on any host).
#
# Every value below comes from the environment - nothing secret is written in this file, because
# this file is committed. Set the Dhan and Telegram values in Dokploy's own Environment tab, or in
# a .env file beside this one on the host (.env is gitignored and .dockerignored).
#
# ASP.NET Core maps a double underscore in an environment variable name to a configuration section
# separator, so Dhan__ClientId sets the Dhan:ClientId that appsettings.json declares.

services:
  optionanalytics:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # Onto the mounted volume below - the container's content root is not persistent.
      Storage__TriggersPath: /app/data/strategy-triggers.json
      Storage__OrderHistoryPath: /app/data/trigger-order-history.json
      # Where the one-time historical spot prefetch caches its NIFTY/BANKNIFTY CSVs - onto the same
      # persistent volume, or the whole window would be re-fetched from Dhan on every redeploy.
      Storage__HistoricalDataPath: /app/data/historical
      # Same idea for the rolling-option (CE/PE premium) prefetch's own per-expiry CSVs - see
      # ExpiredOptionDataPrefetchHostedService.
      Storage__ExpiredOptionDataPath: /app/data/expired-option-data
      # The strategy scanner's record - signals.csv and trades.csv (ScannerLogStore).
      Storage__ScannerLogPath: /app/data/scanner-log
      # Live trades the server closes itself at the scanner's time stop / 15:10 (LiveTimeExitStore).
      Storage__LiveTimeExitsPath: /app/data/live-time-exits.json
      # Keeps the login cookie's signing/encryption key ring on the same persistent volume, so
      # everyone stays logged in across a redeploy instead of the whole key ring (and every
      # outstanding session) resetting every time the container restarts.
      Storage__DataProtectionKeysPath: /app/data/dataprotection-keys
      # The server-side strategy scanner's config (the page's synced settings) and each day's state.
      Storage__ScannerRunnerPath: /app/data/scanner-runner
      # Lots, SL / target / trail, slippage and server scanner on/off per index - the Trade settings page.
      Storage__TradeSettingsPath: /app/data/trade-settings.csv
      Storage__RiskSettingsPath: /app/data/risk-settings.csv
      # Which index the server scanner trades LIVE today, its limits and its live trades.
      Storage__ServerLivePath: /app/data/server-live.json
      # SCANNER_RUNNER_ENABLED=false keeps it from starting (no server-side signals / paper trades).
      ScannerRunner__Enabled: ${SCANNER_RUNNER_ENABLED:-true}

      # Dhan. Either supply a long-lived AccessToken, or leave it empty and set Pin + TotpSecret so
      # DhanTotpAutoRenewalHostedService logs in on its own and keeps the token fresh.
      Dhan__ClientId: ${DHAN_CLIENT_ID:?set DHAN_CLIENT_ID}
      Dhan__AccessToken: ${DHAN_ACCESS_TOKEN:-}
      Dhan__Pin: ${DHAN_PIN:-}
      Dhan__TotpSecret: ${DHAN_TOTP_SECRET:-}

      # CDV/OBV (the Dashboard's cumulative-delta/OBV cards). Set CDV_ENABLED=false to switch it off
      # entirely - no strikes subscribed or processed for it - should it ever hold the live feed
      # back. The header's admin-only "Feed" tag shows how each live consumer is keeping up.
      Cdv__Enabled: ${CDV_ENABLED:-true}

      # Telegram alerting for armed strategy triggers - leave Enabled false to run without it.
      Telegram__Enabled: ${TELEGRAM_ENABLED:-false}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__ChatId: ${TELEGRAM_CHAT_ID:-}

      # One-time NIFTY/BANKNIFTY historical spot download (see HistoricalSpotDataPrefetchHostedService) -
      # off by default like Telegram above; a real year of Dhan traffic, so opt a deployment into it
      # deliberately rather than it running the moment Dhan credentials exist.
      HistoricalDataPrefetch__Enabled: ${HISTORICAL_DATA_PREFETCH_ENABLED:-false}
      # Same idea, for the much larger one-time rolling-option (CE/PE premium, every expiry, the
      # whole ATM+-10 band) download - see ExpiredOptionDataPrefetchHostedService's own doc comment
      # for just how much Dhan traffic this is. Off by default; expect this to run for tens of
      # minutes the first time it is turned on.
      ExpiredOptionDataPrefetch__Enabled: ${EXPIRED_OPTION_DATA_PREFETCH_ENABLED:-false}

      # ConnectionStrings__NiftyDataCollectorTimescale is DELIBERATELY NOT SET HERE. It lets the
      # Expired Backtest page's "Use stored data" toggle read real historical option data straight
      # from NiftyDataCollector's own local-only TimescaleDB (see StoredRollingOptionDataService's
      # own doc comment) - that database is a separate, local-machine-only project this server has
      # no business reaching in a real deployment. With it unset, that data source is simply
      # reported as "not configured" per request (a normal, handled result, never a crash), and the
      # toggle's own UI lets a user switch to live Dhan calls instead. Do not add this var here.

      # Login - the whole app requires one of these two accounts (see AuthOptions/AuthController).
      # Credentials are fixed in appsettings.json (not read from the environment) - only the emails
      # are overridable here. Deliberately NOT setting Auth__AdminPassword/Auth__UserPassword here:
      # ASP.NET Core's environment-variable config provider outranks appsettings.json, so setting
      # either to an empty string would blank out (and lock out) the real password baked into the
      # image instead of merely defaulting it.
      Auth__AdminEmail: ${AUTH_ADMIN_EMAIL:-admin@backtest.com}
      Auth__UserEmail: ${AUTH_USER_EMAIL:-user@backtest.com}
    healthcheck:
      # Matches the Dockerfile's HEALTHCHECK; the long start_period covers the first-run backfill of
      # HistoryWindow.TradingDays trading days (30 as of this writing) across ~68 option contracts,
      # which takes minutes before the app is useful.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 240s
    volumes:
      # Armed triggers are the only thing this app persists; without this they reset on redeploy.
      - optionanalytics-data:/app/data
    ports:
      # Dokploy fronts this with Traefik and its own domain, in which case this mapping is
      # unnecessary - it is here so a plain `docker compose up` on a VPS is immediately reachable.
      - "${HTTP_PORT:-8080}:8080"

volumes:
  optionanalytics-data:
